crons:
  - name: backup-daily
    description: "Backup harian otomatis seluruh database + media ke arsip ZIP di server (retensi 7 terakhir)"
    cron: "0 2 * * *"
    timezone: "Asia/Jakarta"
    endpoint: "{{BASE_URL}}/api/cron/backup-daily"
    method: POST
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    enabled: true
